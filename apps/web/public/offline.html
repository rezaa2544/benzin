<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a6e44" />
    <meta name="robots" content="noindex" />
    <title>بنزین — بدون اینترنت</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f5;
        --surface: #ffffff;
        --ink: #141a16;
        --muted: #5c6860;
        --brand: #0a6e44;
        --brand-ink: #ffffff;
        --line: #dde2dc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c100e;
          --surface: #151b17;
          --ink: #edf2ee;
          --muted: #9eaaa2;
          --brand: #2dc980;
          --brand-ink: #06160e;
          --line: #303a34;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px max(24px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--ink);
        font-family: Vazirmatn, IRANSans, system-ui, 'Segoe UI', Tahoma, sans-serif;
        line-height: 1.8;
      }
      main {
        width: 100%;
        max-width: 380px;
        padding: 28px 22px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 12px;
        border-radius: 18px;
        background: #0a6e44;
        display: grid;
        place-items: center;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.9375rem;
      }
      button {
        min-height: 44px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: var(--brand);
        color: var(--brand-ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .hint {
        margin-top: 16px;
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 100 100" role="img">
          <path d="M50 14C50 14 74 46 74 62a24 24 0 0 1-48 0c0-16 24-48 24-48Z" fill="#ffffff" />
        </svg>
      </div>
      <h1>اتصال اینترنت قطع است</h1>
      <p>
        صفحه‌ی بنزین در حافظه‌ی دستگاه مانده، ولی قیمت‌ها و سفارش‌ها زنده‌اند و بدون اینترنت به‌روز
        نمی‌شوند. هر تغییری که الان ثبت کنید ارسال نمی‌شود.
      </p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
      <p class="hint" id="hint">به‌محض برگشتن شبکه، همین صفحه خودش تازه می‌شود.</p>
    </main>
    <script>
      addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
