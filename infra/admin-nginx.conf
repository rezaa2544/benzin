# Static host for the admin SPA. Caddy has already stripped /admin, so files live at
# the container root and the build's /admin/ asset base is rewritten upstream.
server {
  listen 4173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
