# Static host for the customer app (E0-03 / E9-15). Caddy puts it on the origin root, so the
# service worker scope, the manifest and every icon must be served from `/` with honest cache
# headers: an immutable sw.js would pin users to an old offline shell for a year.
server {
  listen 4173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json
    image/svg+xml;

  # Hashed build output: safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The worker itself must be revalidated on every visit, or updates never reach the device.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location /icons/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # SPA: /market, /orders/:id … all resolve to the shell; the client router takes over.
  location / {
    try_files $uri /index.html;
  }
}
